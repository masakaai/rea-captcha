name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    strategy:
      matrix:
        node: [22.19.0, 24.11.0]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npm run docs:check

  python:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s python/tests -p 'test_*.py' -v
      - run: python -m pip wheel ./python --no-deps --wheel-dir dist
      - name: Verify Browser Use adapter contract
        if: matrix.python == '3.12'
        env:
          ANONYMIZED_TELEMETRY: 'false'
          BROWSER_USE_CLOUD_SYNC: 'false'
        run: |
          python -m pip install './python[browser-use]'
          python -m unittest discover -s python/integration_tests -p 'test_*.py' -v
