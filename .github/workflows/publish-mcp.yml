name: Publish MCP Registry metadata

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish npm package]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          package-manager-cache: false
      - name: Verify npm and MCP metadata versions
        run: node scripts/verify-mcp-registry.mjs --published
      - name: Install the pinned MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256_LINUX_AMD64: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLo "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256_LINUX_AMD64}  ${archive}" | sha256sum --check --strict
          tar xzf "${archive}" mcp-publisher
          chmod +x mcp-publisher
      - name: Validate MCP Registry metadata
        run: |
          for attempt in 1 2 3 4; do
            if ./mcp-publisher validate; then
              exit 0
            fi
            if [ "${attempt}" -eq 4 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Authenticate with GitHub Actions OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish MCP Registry metadata
        run: |
          for attempt in 1 2 3 4; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            if [ "${attempt}" -eq 4 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
