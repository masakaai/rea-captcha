<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Owned image text verification demo</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="card"><p class="eyebrow">CASE 4 · OWNED LOCAL BOUNDARY</p><h1>Image and text verification</h1>
<p>The expected value is validated only by this local demo server. No data is sent to a solver.</p>
<form data-provider="image-text"><div class="code" role="img" aria-label="verification characters">LOCAL42</div>
<label>Verification code <input name="captcha_code" autocomplete="off" required></label>
<button type="submit">Validate protected action</button><p data-status aria-live="polite"></p></form></main><script type="module" src="/demo.js"></script></body></html>
