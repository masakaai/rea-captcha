<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">rea-captcha — keep browser-use moving</title>
  <desc id="description">Same-session CAPTCHA handoff and fresh-evidence resume for browser agents.</desc>
  <style>
    .sans { font-family: "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
  </style>
  <rect width="1280" height="640" fill="#f4f1e8"/>
  <path d="M640 0v640" stroke="#bdb7aa"/>

  <g transform="translate(64 58)">
    <text class="sans" x="0" y="56" fill="#171715" font-size="54" font-weight="900" letter-spacing="-4">REA</text>
    <rect x="112" y="0" width="254" height="72" fill="#171715"/>
    <text class="sans" x="128" y="54" fill="#f4f1e8" font-size="43" font-weight="900" letter-spacing="-3">CAPTCHA</text>

    <text class="mono" x="0" y="132" fill="#171715" font-size="15" font-weight="700" letter-spacing="2.2">SAME-SESSION VERIFICATION FOR BROWSER AGENTS</text>
    <text class="sans" x="0" y="220" fill="#171715" font-size="64" font-weight="500" letter-spacing="-3.5">keep browser-use</text>
    <text class="serif" x="0" y="304" fill="#171715" font-size="88" font-style="italic" letter-spacing="-4">moving.</text>

    <text class="sans" x="0" y="370" fill="#6e6a62" font-size="22">A CAPTCHA interrupts the run. Keep the browser,</text>
    <text class="sans" x="0" y="402" fill="#6e6a62" font-size="22">verify fresh evidence, then resume the same task.</text>

    <rect x="0" y="452" width="510" height="66" fill="#171715"/>
    <text class="mono" x="24" y="494" fill="#f4f1e8" font-size="18">npm install rea-captcha</text>
    <text class="mono" x="0" y="558" fill="#6e6a62" font-size="15">LOCAL MCP + SDK  ·  FOUR CONTROLLED CASES  ·  MIT</text>
  </g>

  <g transform="translate(690 58)">
    <rect x="12" y="12" width="514" height="506" fill="#f2ad7f"/>
    <rect width="514" height="506" fill="#ebe6dc" stroke="#171715" stroke-width="2"/>
    <path d="M0 64h514" stroke="#bdb7aa"/>
    <text class="mono" x="24" y="39" fill="#171715" font-size="14" font-weight="700">existing browser session</text>
    <circle cx="442" cy="32" r="5" fill="none" stroke="#171715"/>
    <circle cx="462" cy="32" r="5" fill="none" stroke="#171715"/>
    <circle cx="482" cy="32" r="5" fill="none" stroke="#171715"/>

    <rect x="30" y="94" width="454" height="272" fill="#fffefa" stroke="#171715" stroke-width="2"/>
    <rect x="46" y="110" width="190" height="28" fill="#171715"/>
    <text class="mono" x="59" y="129" fill="#f4f1e8" font-size="12" font-weight="700">BROWSER-USE TASK</text>
    <text class="sans" x="54" y="204" fill="#171715" font-size="37" font-weight="700" letter-spacing="-1.5">Verification detected</text>
    <text class="sans" x="54" y="244" fill="#6e6a62" font-size="18">Pause the agent loop. Preserve this page.</text>

    <rect x="54" y="282" width="34" height="34" fill="#f2ad7f" stroke="#171715"/>
    <path d="m63 299 7 7 12-15" fill="none" stroke="#171715" stroke-width="3"/>
    <text class="sans" x="104" y="305" fill="#171715" font-size="19" font-weight="700">fresh evidence before resume</text>

    <g transform="translate(30 398)">
      <rect width="454" height="72" fill="#f4f1e8" stroke="#171715"/>
      <rect x="227" width="113.5" height="72" fill="#f2ad7f"/>
      <path d="M113.5 0v72M227 0v72M340.5 0v72" stroke="#171715"/>
      <text class="mono" x="25" y="43" fill="#171715" font-size="14" font-weight="700">DETECT</text>
      <text class="mono" x="147" y="43" fill="#171715" font-size="14" font-weight="700">HANDOFF</text>
      <text class="mono" x="251" y="43" fill="#171715" font-size="14" font-weight="700">VERIFY</text>
      <text class="mono" x="367" y="43" fill="#171715" font-size="14" font-weight="700">RESUME</text>
    </g>
  </g>
</svg>
