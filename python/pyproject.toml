[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rea-captcha"
version = "0.2.4"
description = "Browser-use adapter and optional local OCR worker for rea-captcha."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MASAKA AI" }]
dependencies = []

[project.optional-dependencies]
browser-use = ["browser-use>=0.13.11,<0.14"]
ocr = ["ddddocr>=1.5,<2"]
test = []

[tool.hatch.build.targets.wheel]
packages = ["src/rea_captcha"]
