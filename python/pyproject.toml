[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rea-captcha"
version = "0.3.1"
description = "Safe same-session CAPTCHA handoff for Browser Use, with fresh-evidence resume and optional local OCR."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MASAKA AI" }]
keywords = [
  "ai-agents",
  "browser-automation",
  "browser-use",
  "captcha",
  "cdp",
  "human-in-the-loop",
  "playwright",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://rea-captcha.vercel.app/"
Documentation = "https://github.com/masakaai/rea-captcha#readme"
Repository = "https://github.com/masakaai/rea-captcha"
Issues = "https://github.com/masakaai/rea-captcha/issues"
Changelog = "https://github.com/masakaai/rea-captcha/releases"

[project.optional-dependencies]
browser-use = ["browser-use>=0.13.11,<0.14"]
ocr = ["ddddocr>=1.5,<2"]
test = []

[tool.hatch.build.targets.wheel]
packages = ["src/rea_captcha"]
